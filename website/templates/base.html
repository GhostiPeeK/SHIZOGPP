<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHIZOGP - CS2 Маркетплейс</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0f;
            color: white;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .navbar {
            background: rgba(10,10,15,0.95);
            padding: 20px 0;
            border-bottom: 1px solid #2a2a35;
        }
        .logo {
            font-size: 28px;
            font-weight: 800;
            text-decoration: none;
            color: white;
        }
        .logo span {
            color: #ff3366;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background: #ff3366;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
        }
        .listings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin: 40px 0;
        }
        .listing-card {
            background: #1a1a24;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #2a2a35;
        }
        .listing-info {
            padding: 15px;
        }
        .listing-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .listing-price {
            font-size: 24px;
            font-weight: 700;
            color: #ff3366;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="logo">SHIZO<span>GP</span></a>
        </div>
    </nav>
    
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
